name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        type: boolean
        description: Include the dedicated customer Cascade journey
        default: false
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  native-acceptance:
    if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || vars.CUSTOMER_NATIVE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Confirm the locked Pi host
        run: npm ls --depth=0 @earendil-works/pi-coding-agent@1.5.0
      - name: Install the packed plugin into native Pi and exercise enforcement
        env:
          NATIVE_ACCEPTANCE_RECEIPT: ${{ runner.temp }}/native-acceptance/receipt.json
        run: npm run test:native
      - name: Exercise native Pi against customer Cascade
        if: inputs.live == true || vars.CUSTOMER_NATIVE_ENABLED == 'true'
        env:
          NATIVE_ACCEPTANCE_RECEIPT: ${{ runner.temp }}/native-acceptance/live-receipt.json
          CUSTOMER_NATIVE_CLASSIFIER: live
          CUSTOMER_NATIVE_API_URL: ${{ vars.CUSTOMER_API_URL }}
          CUSTOMER_NATIVE_API_KEY: ${{ secrets.CUSTOMER_API_KEY }}
        run: npm run test:native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-acceptance
          path: ${{ runner.temp }}/native-acceptance/
          retention-days: 14
