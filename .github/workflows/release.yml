name: Customer qualification and release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact main candidate after qualification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: customer-release
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.version.outputs.selected }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select a declared version bump or manual qualification
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          MANIFEST: package.json
        shell: python
        run: |
          import json, os, re, subprocess
          from pathlib import Path
          path = os.environ["MANIFEST"]
          def version(text):
              if path.endswith(".yaml"):
                  fields = re.findall(r"^version:\s*(\d+\.\d+\.\d+)\s*$", text, re.M)
                  if len(fields) != 1:
                      raise ValueError("Expected one plugin version")
                  return fields[0]
              return json.loads(text)["version"]
          current = version(Path(path).read_text())
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", current):
              raise ValueError("Expected a stable release version")
          selected = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          if not selected:
              before = os.environ["BEFORE"]
              previous = version(subprocess.check_output(["git", "show", f"{before}:{path}"], text=True))
              selected = current != previous
              if selected and tuple(map(int, current.split("."))) <= tuple(map(int, previous.split("."))):
                  raise ValueError("Release version must increase")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"selected={str(selected).lower()}\nversion={current}", file=output)
  validation:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_filename: ${{ steps.pack.outputs.artifact_filename }}
      candidate_name: ${{ steps.pack.outputs.candidate_name }}
      artifact_integrity: ${{ steps.pack.outputs.artifact_integrity }}
      artifact_sha256: ${{ steps.pack.outputs.artifact_sha256 }}
      commit: ${{ steps.release.outputs.commit }}
      package_exists: ${{ steps.registry.outputs.package_exists }}
      registry_status: ${{ steps.registry.outputs.registry_status }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the GitHub run commit with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve immutable release
        id: release
        env:
          EXPECTED_PACKAGE_NAME: "@silmaril-security/pi-firewall-plugin"
          EXPECTED_REPOSITORY_TYPE: git
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Silmaril-Security/PiFirewallPlugin.git"
          RELEASE_TAG: v${{ needs.plan.outputs.version }}
          RUN_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$RUN_COMMIT"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RUN_COMMIT"
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_private="$(node -p "String(require('./package.json').private === true)")"
          repository_type="$(node -p "require('./package.json').repository?.type ?? ''")"
          repository_url="$(node -p "require('./package.json').repository?.url ?? ''")"

          if [[ "$package_name" != "$EXPECTED_PACKAGE_NAME" ]]; then
            echo "Unexpected package name: ${package_name}" >&2
            exit 1
          fi
          if [[ "$repository_type" != "$EXPECTED_REPOSITORY_TYPE" ]] \
            || [[ "$repository_url" != "$EXPECTED_REPOSITORY_URL" ]]; then
            echo "Package repository metadata does not match the canonical repository." >&2
            exit 1
          fi
          if [[ "$package_private" == "true" ]]; then
            echo "Refusing to publish a private package." >&2
            exit 1
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must use strict MAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Release tag does not match package version." >&2
            exit 1
          fi

          {
            printf 'commit=%s\n' "$RUN_COMMIT"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install npm 11.21.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.21.0
          [[ "$(npm --version)" == "11.21.0" ]]

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run safe tests against locked Pi host
        shell: bash
        run: |
          set -euo pipefail
          npm ls --depth=0 @earendil-works/pi-coding-agent@1.5.0
          node --import tsx --test test/runtime.test.ts test/mac-computer-name.test.ts test/pi-host-compat.test.ts

      - name: Build release artifact
        id: pack
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_name=npm-package-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

          artifact_dir="${RUNNER_TEMP}/release-artifact"
          pack_json="${RUNNER_TEMP}/npm-pack.json"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          npm pack --json --pack-destination "$artifact_dir" > "$pack_json"

          shopt -s nullglob
          tarballs=("$artifact_dir"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one packed tarball." >&2
            exit 1
          fi

          artifact_path="${tarballs[0]}"
          artifact_filename="$(basename "$artifact_path")"
          expected_filename="silmaril-security-pi-firewall-plugin-${RELEASE_VERSION}.tgz"
          if [[ "$artifact_filename" != "$expected_filename" ]] \
            || [[ ! "$artifact_filename" =~ ^silmaril-security-pi-firewall-plugin-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]; then
            echo "Packed artifact filename is not the validated package/version filename." >&2
            exit 1
          fi

          artifact_integrity="$(
            node --input-type=module - "$artifact_path" <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";

          const bytes = fs.readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"

          PACK_JSON_PATH="$pack_json" \
          ARTIFACT_FILENAME="$artifact_filename" \
          ARTIFACT_INTEGRITY="$artifact_integrity" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";

          const packed = JSON.parse(fs.readFileSync(process.env.PACK_JSON_PATH, "utf8"));
          if (!Array.isArray(packed) || packed.length !== 1) {
            throw new Error("npm pack JSON did not describe exactly one artifact");
          }
          if (packed[0].filename !== process.env.ARTIFACT_FILENAME) {
            throw new Error("npm pack JSON filename does not match the produced artifact");
          }
          if (packed[0].integrity !== process.env.ARTIFACT_INTEGRITY) {
            throw new Error("npm pack JSON integrity does not match the produced artifact bytes");
          }
          NODE

          {
            printf 'artifact_filename=%s\n' "$artifact_filename"
            printf 'artifact_integrity=%s\n' "$artifact_integrity"
            printf 'artifact_sha256=%s\n' "$(sha256sum "$artifact_path" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pack.outputs.candidate_name }}
          path: ${{ runner.temp }}/release-artifact/${{ steps.pack.outputs.artifact_filename }}
          if-no-files-found: error
          retention-days: 1

      - name: Check public registry
        id: registry
        env:
          ARTIFACT_INTEGRITY: ${{ steps.pack.outputs.artifact_integrity }}
          EXPECTED_PACKAGE_NAME: "@silmaril-security/pi-firewall-plugin"
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const name = process.env.EXPECTED_PACKAGE_NAME;
          const version = process.env.RELEASE_VERSION;
          const integrity = process.env.ARTIFACT_INTEGRITY;
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url, {
            headers: { accept: "application/json" },
          });

          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "package_exists=false\nregistry_status=absent\n");
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `npm registry status: ${name}@${version} is absent and eligible for trusted publishing.\n`,
            );
            console.log(`npm registry status: ${name}@${version} is absent.`);
            process.exit(0);
          }

          if (!response.ok) {
            throw new Error(`npm registry returned HTTP ${response.status}; refusing to publish`);
          }

          const metadata = await response.json();
          if (metadata.name !== name || metadata.version !== version) {
            throw new Error("npm registry returned mismatched package metadata");
          }
          if (metadata.dist?.integrity !== integrity) {
            throw new Error(
              "Existing npm version has different tarball integrity; coordinator inspection is required",
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            "package_exists=true\nregistry_status=existing_identical_artifact\n",
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `npm registry status: ${name}@${version} already has the identical ${integrity} artifact; publish skipped.\n`,
          );
          console.log(`npm registry status: ${name}@${version} already has the identical artifact.`);
          NODE

  customer:
    name: Customer release acceptance
    needs: [plan, validation]
    runs-on: ubuntu-24.04
    outputs:
      framework_sha: ${{ steps.framework.outputs.commit }}
      acceptance_attempt: ${{ steps.attempt.outputs.number }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validation.outputs.candidate_name }}
          path: ${{ runner.temp }}/customer-candidate
      - uses: actions/create-github-app-token@v3
        id: reader
        with:
          client-id: ${{ vars.CUSTOMER_TESTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUSTOMER_TESTS_APP_PRIVATE_KEY }}
          owner: Silmaril-Security
          repositories: SilmarilCustomerTests
          permission-contents: read
      - uses: actions/checkout@v4
        id: framework
        with:
          repository: Silmaril-Security/SilmarilCustomerTests
          ref: 3dd837d6cfc8e88c7b4d72b833ae62ae7105d9e5
          token: ${{ steps.reader.outputs.token }}
          path: _customer
          persist-credentials: false
      - name: Record this qualification attempt
        id: attempt
        run: echo "number=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Exercise the exact release candidate
        uses: ./_customer/actions/release-acceptance
        env:
          CUSTOMER_NATIVE_API_URL: ${{ vars.CUSTOMER_API_URL }}
          CUSTOMER_NATIVE_API_KEY: ${{ secrets.CUSTOMER_API_KEY }}
        with:
          product: PiFirewallPlugin
          source-sha: ${{ github.sha }}
          version: ${{ needs.plan.outputs.version }}
          artifact: ${{ runner.temp }}/customer-candidate/${{ needs.validation.outputs.artifact_filename }}
          driver: scripts/customer-published-acceptance
          expected-digest: ${{ needs.validation.outputs.artifact_sha256 }}

  publish:
    name: Publish to npm
    needs: [plan, validation, customer]
    if: needs.validation.outputs.package_exists == 'false' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validation.outputs.commit }}

      - name: Verify validated release identity
        env:
          EXPECTED_PACKAGE_NAME: "@silmaril-security/pi-firewall-plugin"
          EXPECTED_REPOSITORY_TYPE: git
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Silmaril-Security/PiFirewallPlugin.git"
          RELEASE_COMMIT: ${{ needs.validation.outputs.commit }}
          RELEASE_TAG: ${{ needs.validation.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validation.outputs.version }}
          RUN_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUN_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "Publish job GitHub run commit does not match the validated release commit." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
            echo "Publish checkout does not match the validated commit." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_private="$(node -p "String(require('./package.json').private === true)")"
          repository_type="$(node -p "require('./package.json').repository?.type ?? ''")"
          repository_url="$(node -p "require('./package.json').repository?.url ?? ''")"
          if [[ "$package_name" != "$EXPECTED_PACKAGE_NAME" ]] \
            || [[ "$package_version" != "$RELEASE_VERSION" ]] \
            || [[ "$RELEASE_TAG" != "v${package_version}" ]] \
            || [[ "$package_private" == "true" ]] \
            || [[ "$repository_type" != "$EXPECTED_REPOSITORY_TYPE" ]] \
            || [[ "$repository_url" != "$EXPECTED_REPOSITORY_URL" ]]; then
            echo "Package metadata no longer matches the validated release." >&2
            exit 1
          fi

      - name: Download validated release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validation.outputs.candidate_name }}
          path: ${{ runner.temp }}/release-artifact

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install npm 11.21.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.21.0
          [[ "$(npm --version)" == "11.21.0" ]]

      - name: Verify downloaded release artifact
        env:
          ARTIFACT_FILENAME: ${{ needs.validation.outputs.artifact_filename }}
          ARTIFACT_INTEGRITY: ${{ needs.validation.outputs.artifact_integrity }}
          ARTIFACT_ROOT: ${{ runner.temp }}/release-artifact
          EXPECTED_PACKAGE_NAME: "@silmaril-security/pi-firewall-plugin"
          EXPECTED_REPOSITORY_TYPE: git
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Silmaril-Security/PiFirewallPlugin.git"
          RELEASE_TAG: ${{ needs.validation.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          expected_filename="silmaril-security-pi-firewall-plugin-${RELEASE_VERSION}.tgz"
          if [[ "$ARTIFACT_FILENAME" != "$expected_filename" ]] \
            || [[ ! "$ARTIFACT_FILENAME" =~ ^silmaril-security-pi-firewall-plugin-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]; then
            echo "Artifact filename is not safe or does not match the validated version." >&2
            exit 1
          fi

          shopt -s nullglob
          tarballs=("$ARTIFACT_ROOT"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]] \
            || [[ "$(basename "${tarballs[0]}")" != "$ARTIFACT_FILENAME" ]]; then
            echo "Downloaded artifact set does not contain exactly the validated tarball." >&2
            exit 1
          fi
          artifact_path="${tarballs[0]}"
          actual_integrity="$(
            node --input-type=module - "$artifact_path" <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";

          const bytes = fs.readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"
          if [[ "$actual_integrity" != "$ARTIFACT_INTEGRITY" ]]; then
            echo "Downloaded artifact integrity does not match validation output." >&2
            exit 1
          fi

          tar -xOf "$artifact_path" package/package.json > "${RUNNER_TEMP}/artifact-package.json"
          PACKAGE_JSON_PATH="${RUNNER_TEMP}/artifact-package.json" \
          EXPECTED_PACKAGE_NAME="$EXPECTED_PACKAGE_NAME" \
          EXPECTED_REPOSITORY_TYPE="$EXPECTED_REPOSITORY_TYPE" \
          EXPECTED_REPOSITORY_URL="$EXPECTED_REPOSITORY_URL" \
          RELEASE_TAG="$RELEASE_TAG" \
          RELEASE_VERSION="$RELEASE_VERSION" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";

          const manifest = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON_PATH, "utf8"));
          if (
            manifest.name !== process.env.EXPECTED_PACKAGE_NAME
            || manifest.version !== process.env.RELEASE_VERSION
            || process.env.RELEASE_TAG !== `v${manifest.version}`
            || manifest.private === true
            || manifest.repository?.type !== process.env.EXPECTED_REPOSITORY_TYPE
            || manifest.repository?.url !== process.env.EXPECTED_REPOSITORY_URL
          ) {
            throw new Error("Packed manifest does not match the validated release identity");
          }
          NODE

      - uses: actions/download-artifact@v4
        with:
          name: customer-release-acceptance-attempt-${{ needs.customer.outputs.acceptance_attempt }}
          path: ${{ runner.temp }}/customer-receipt
      - uses: actions/create-github-app-token@v3
        id: reader
        with:
          client-id: ${{ vars.CUSTOMER_TESTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUSTOMER_TESTS_APP_PRIVATE_KEY }}
          owner: Silmaril-Security
          repositories: SilmarilCustomerTests
          permission-contents: read
      - uses: actions/checkout@v4
        id: framework
        with:
          repository: Silmaril-Security/SilmarilCustomerTests
          ref: ${{ needs.customer.outputs.framework_sha }}
          token: ${{ steps.reader.outputs.token }}
          path: _customer
          persist-credentials: false
      - name: Verify the acceptance receipt against the bytes to publish
        env:
          QUALIFIED_ATTEMPT: ${{ needs.customer.outputs.acceptance_attempt }}
          CANDIDATE: ${{ runner.temp }}/release-artifact/${{ needs.validation.outputs.artifact_filename }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(sha256sum "$CANDIDATE" | cut -d' ' -f1)
          python3 _customer/scripts/verify_release.py --receipt "$RUNNER_TEMP/customer-receipt/receipt.json" \
            --product PiFirewallPlugin --source-sha "$GITHUB_SHA" --version "$VERSION" \
            --digest "$digest" --run-id "$GITHUB_RUN_ID" --attempt "$QUALIFIED_ATTEMPT"
      - name: Publish with trusted provenance
        env:
          ARTIFACT_FILENAME: ${{ needs.validation.outputs.artifact_filename }}
          ARTIFACT_ROOT: ${{ runner.temp }}/release-artifact
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${ARTIFACT_ROOT}/${ARTIFACT_FILENAME}" --access public --provenance --ignore-scripts

  finalize:
    name: Publish immutable GitHub release
    needs: [plan, validation, customer, publish]
    if: always() && !cancelled() && needs.customer.result == 'success' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && needs.validation.outputs.package_exists == 'true')) && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validation.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: customer-release-acceptance-attempt-${{ needs.customer.outputs.acceptance_attempt }}
          path: ${{ runner.temp }}/customer-receipt
      - uses: actions/create-github-app-token@v3
        id: reader
        with:
          client-id: ${{ vars.CUSTOMER_TESTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUSTOMER_TESTS_APP_PRIVATE_KEY }}
          owner: Silmaril-Security
          repositories: SilmarilCustomerTests
          permission-contents: read
      - uses: actions/checkout@v4
        id: framework
        with:
          repository: Silmaril-Security/SilmarilCustomerTests
          ref: ${{ needs.customer.outputs.framework_sha }}
          token: ${{ steps.reader.outputs.token }}
          path: _customer
          persist-credentials: false
      - name: Verify the acceptance receipt against the bytes to publish
        env:
          QUALIFIED_ATTEMPT: ${{ needs.customer.outputs.acceptance_attempt }}
          CANDIDATE: ${{ runner.temp }}/candidate/${{ needs.validation.outputs.artifact_filename }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(sha256sum "$CANDIDATE" | cut -d' ' -f1)
          python3 _customer/scripts/verify_release.py --receipt "$RUNNER_TEMP/customer-receipt/receipt.json" \
            --product PiFirewallPlugin --source-sha "$GITHUB_SHA" --version "$VERSION" \
            --digest "$digest" --run-id "$GITHUB_RUN_ID" --attempt "$QUALIFIED_ATTEMPT"
      - name: Publish the verified bytes once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CANDIDATE: ${{ runner.temp }}/candidate/${{ needs.validation.outputs.artifact_filename }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          file=$(basename "$CANDIDATE")
          remote_git() { git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"; }
          if remote_git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            remote_git fetch --no-tags origin "refs/tags/$tag"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          else
            code=$?
            test "$code" -eq 2
          fi
          sha=$(sha256sum "$CANDIDATE" | cut -d' ' -f1)
          note="Qualified customer release $tag from $GITHUB_SHA (SHA-256 $sha)."
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --target "$GITHUB_SHA" --notes "$note"
          fi
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [[ "$draft" == true ]]; then
            test "$(gh release view "$tag" --json body --jq .body)" = "$note"
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if [[ -z "$assets" ]]; then
              gh release upload "$tag" "$CANDIDATE"
            else
              test "$assets" = "$file"
            fi
          fi
          dir=$(mktemp -d)
          gh release download "$tag" --pattern "$file" --dir "$dir"
          cmp "$CANDIDATE" "$dir/$file"
          if [[ "$draft" == true ]]; then
            # Claim the tag only after acceptance; concurrent creation may only agree.
            if ! remote_git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null ||
                remote_git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
            fi
            remote_git fetch --no-tags origin "refs/tags/$tag"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
            gh release edit "$tag" --draft=false
          fi
